<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <defs>
    <style>
      .paper { fill:#0f1218; }
      .t     { fill:#ffffff; font-size:16px; font-weight:700; }
      .lbl   { fill:#cfd2cc; font-size:12.5px; }
      .sub   { fill:#8e96a2; font-size:11px; }
      .py    { fill:#102a33; stroke:#22d3ee; stroke-width:2.5; }
      .pytxt { fill:#67e8f9; font-size:13px; font-weight:700; }
      .box   { fill:#1c2129; stroke:#2EAADC; stroke-width:1.8; }
      .big   { fill:#161b22; stroke:#2EAADC; stroke-width:2.5; }
      .hand  { fill:none; stroke:#22d3ee; stroke-width:2.5; marker-end:url(#c); marker-start:url(#cs); }
      .eye   { fill:none; stroke:#8e96a2; stroke-width:2; stroke-dasharray:6 4; marker-end:url(#g); }
      .sata  { fill:none; stroke:#2EAADC; stroke-width:2.5; marker-end:url(#a); marker-start:url(#as); }
      .side  { fill:#2EAADC; font-size:12px; font-weight:700; }
    </style>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2EAADC"/></marker>
    <marker id="as" markerWidth="9" markerHeight="9" refX="0" refY="3" orient="auto"><path d="M7,0 L0,3 L7,6 Z" fill="#2EAADC"/></marker>
    <marker id="c" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#22d3ee"/></marker>
    <marker id="cs" markerWidth="9" markerHeight="9" refX="0" refY="3" orient="auto"><path d="M7,0 L0,3 L7,6 Z" fill="#22d3ee"/></marker>
    <marker id="g" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#8e96a2"/></marker>
  </defs>

  <rect class="paper" x="0" y="0" width="980" height="560"/>
  <text class="t" x="490" y="34" text-anchor="middle" fill="#2EAADC">The bench: give the agent hands and eyes</text>

  <!-- Host -->
  <rect class="big" x="40" y="70" width="300" height="330" rx="12"/>
  <text class="t"   x="190" y="98" text-anchor="middle">Host PC</text>

  <rect class="py" x="60" y="118" width="260" height="56" rx="9"/>
  <text class="pytxt" x="190" y="141" text-anchor="middle">Claude: drives the bench</text>
  <text class="sub"   x="190" y="159" text-anchor="middle">builds, loads, pokes, captures</text>

  <rect class="py" x="60" y="188" width="260" height="56" rx="9"/>
  <text class="pytxt" x="190" y="211" text-anchor="middle">Codex: independent review</text>
  <text class="sub"   x="190" y="229" text-anchor="middle">briefs out, corrections back in</text>

  <rect class="box" x="60" y="258" width="260" height="56" rx="9"/>
  <text class="lbl" x="190" y="281" text-anchor="middle">litex_server · litescope_cli</text>
  <text class="sub" x="190" y="299" text-anchor="middle">sds1104.py (SCPI/VXI-11 helper)</text>

  <rect class="box" x="60" y="328" width="260" height="52" rx="9"/>
  <text class="lbl" x="190" y="349" text-anchor="middle">yosys + nextpnr + trellis</text>
  <text class="sub" x="190" y="367" text-anchor="middle">rebuild in 20 s to 2 min when needed</text>

  <!-- Board -->
  <rect class="big" x="430" y="70" width="300" height="330" rx="12"/>
  <text class="t"   x="580" y="98" text-anchor="middle">ECPIX-5 (ECP5-85F)</text>
  <text class="sub" x="580" y="116" text-anchor="middle">LiteX SoCMini @ 100 MHz</text>

  <rect class="box" x="450" y="128" width="260" height="56" rx="9"/>
  <text class="lbl" x="580" y="151" text-anchor="middle">DCU SerDes + OOB PHY</text>
  <text class="sub" x="580" y="169" text-anchor="middle">COMGenerator / COMChecker in fabric</text>

  <rect class="py" x="450" y="198" width="260" height="56" rx="9"/>
  <text class="pytxt" x="580" y="221" text-anchor="middle">~20 runtime knobs, all CSRs</text>
  <text class="sub"   x="580" y="239" text-anchor="middle">most experiments = a register write</text>

  <rect class="box" x="450" y="268" width="260" height="56" rx="9"/>
  <text class="lbl" x="580" y="291" text-anchor="middle">LiteScope analyzer</text>
  <text class="sub" x="580" y="309" text-anchor="middle">115 bits @ 100 MS/s · sys/tx/rx domains</text>

  <rect class="box" x="450" y="338" width="260" height="42" rx="9"/>
  <text class="lbl" x="580" y="364" text-anchor="middle">UARTBone @ 1 Mbaud</text>

  <!-- Drive -->
  <rect class="big" x="820" y="150" width="130" height="170" rx="12"/>
  <text class="t"   x="885" y="205" text-anchor="middle">SATA</text>
  <text class="t"   x="885" y="228" text-anchor="middle">drive</text>
  <text class="sub" x="885" y="262" text-anchor="middle">COMINIT beacon</text>
  <text class="sub" x="885" y="278" text-anchor="middle">every 10.003 ms</text>

  <!-- Scope -->
  <rect class="box" x="430" y="450" width="300" height="70" rx="9"/>
  <text class="lbl" x="580" y="477" text-anchor="middle">Siglent SDS1104X-E</text>
  <text class="sub" x="580" y="495" text-anchor="middle">probe on C113, the TX coupling cap</text>
  <text class="sub" x="580" y="510" text-anchor="middle">envelope detector = automated OOB ruler</text>

  <!-- links -->
  <line class="hand" x1="346" y1="200" x2="424" y2="200"/>
  <text class="side" x="385" y="188" text-anchor="middle">hands</text>
  <text class="sub"  x="385" y="222" text-anchor="middle">CSRs over</text>
  <text class="sub"  x="385" y="237" text-anchor="middle">UARTBone</text>

  <line class="sata" x1="736" y1="235" x2="814" y2="235"/>
  <text class="sub" x="775" y="223" text-anchor="middle">3.0 Gb/s</text>

  <line class="eye" x1="430" y1="296" x2="346" y2="296"/>
  <text class="side" x="385" y="284" text-anchor="middle" fill="#8e96a2">eyes #1</text>
  <text class="sub"  x="385" y="318" text-anchor="middle">LiteScope dumps</text>

  <line class="eye" x1="426" y1="485" x2="190" y2="485"/>
  <line class="eye" x1="190" y1="480" x2="190" y2="404"/>
  <text class="side" x="300" y="473" text-anchor="middle" fill="#8e96a2">eyes #2</text>
  <text class="sub"  x="300" y="503" text-anchor="middle">waveforms over Ethernet</text>
  <line class="eye" x1="620" y1="446" x2="700" y2="384"/>

  <text class="sub" x="875" y="485" text-anchor="middle">no human at the</text>
  <text class="sub" x="875" y="501" text-anchor="middle">bench required</text>
</svg>
