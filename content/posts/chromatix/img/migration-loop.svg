<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <defs>
    <style>
      .t     { fill:#2EAADC; font-size:16px; font-weight:700; }
      .n     { fill:#67e8f9; font-size:13px; font-weight:700; }
      .lbl   { fill:#ffffff; font-size:14px; font-weight:700; }
      .sub   { fill:#8e96a2; font-size:11px; }
      .box   { fill:#1c2129; stroke:#2EAADC; stroke-width:1.8; }
      .key   { fill:#102a33; stroke:#22d3ee; stroke-width:2.5; }
      .w     { fill:none; stroke:#2EAADC; stroke-width:2; marker-end:url(#a); }
      .back  { fill:none; stroke:#8e96a2; stroke-width:1.8; stroke-dasharray:6 4; marker-end:url(#g); }
    </style>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2EAADC"/></marker>
    <marker id="g" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#8e96a2"/></marker>
  </defs>
  <rect x="0" y="0" width="980" height="300" fill="#0f1218"/>
  <text class="t" x="490" y="34" text-anchor="middle">One block at a time, the console working after every step</text>

  <rect class="box" x="30"  y="80" width="160" height="110" rx="10"/>
  <text class="n"   x="110" y="106" text-anchor="middle">1</text>
  <text class="lbl" x="110" y="128" text-anchor="middle">Isolate</text>
  <text class="sub" x="110" y="150" text-anchor="middle">cut the block out,</text>
  <text class="sub" x="110" y="166" text-anchor="middle">keep the original</text>

  <rect class="box" x="220" y="80" width="160" height="110" rx="10"/>
  <text class="n"   x="300" y="106" text-anchor="middle">2</text>
  <text class="lbl" x="300" y="128" text-anchor="middle">Port</text>
  <text class="sub" x="300" y="150" text-anchor="middle">LiteX/Migen, reuse</text>
  <text class="sub" x="300" y="166" text-anchor="middle">LiteX cores or LUNA</text>

  <rect class="key" x="410" y="80" width="160" height="110" rx="10"/>
  <text class="n"   x="490" y="106" text-anchor="middle">3</text>
  <text class="lbl" x="490" y="128" text-anchor="middle">Prove</text>
  <text class="sub" x="490" y="150" text-anchor="middle">Yosys miter: SAT</text>
  <text class="sub" x="490" y="166" text-anchor="middle">+ ABC PDR, pytest</text>

  <rect class="key" x="600" y="80" width="160" height="110" rx="10"/>
  <text class="n"   x="680" y="106" text-anchor="middle">4</text>
  <text class="lbl" x="680" y="128" text-anchor="middle">Check</text>
  <text class="sub" x="680" y="150" text-anchor="middle">flash, press buttons,</text>
  <text class="sub" x="680" y="166" text-anchor="middle">capture UVC/UAC</text>

  <rect class="box" x="790" y="80" width="160" height="110" rx="10"/>
  <text class="n"   x="870" y="106" text-anchor="middle">5</text>
  <text class="lbl" x="870" y="128" text-anchor="middle">Delete</text>
  <text class="sub" x="870" y="150" text-anchor="middle">legacy RTL/IP gone,</text>
  <text class="sub" x="870" y="166" text-anchor="middle">commit</text>

  <line class="w" x1="190" y1="135" x2="216" y2="135"/>
  <line class="w" x1="380" y1="135" x2="406" y2="135"/>
  <line class="w" x1="570" y1="135" x2="596" y2="135"/>
  <line class="w" x1="760" y1="135" x2="786" y2="135"/>

  <path class="back" d="M870,190 V240 H110 V196"/>
  <text class="sub" x="490" y="260" text-anchor="middle">next block · 29 steps · 6 phases: build, LiteX infra, glue/peripherals, memory, video, USB</text>
</svg>
