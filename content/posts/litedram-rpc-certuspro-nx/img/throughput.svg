<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <defs>
    <style>
      .t    { fill:#2EAADC; font-size:16px; font-weight:700; }
      .s    { fill:#8e96a2; font-size:12px; }
      .lbl  { fill:#e6e8e3; font-size:12.5px; font-weight:700; }
      .sub  { fill:#8e96a2; font-size:11px; }
      .val  { fill:#e6e8e3; font-size:12px; font-weight:700; }
      .grid { stroke:#2a313b; stroke-width:1; }
      .ax   { fill:#8e96a2; font-size:11px; }
      .bus  { stroke:#22d3ee; stroke-width:1.5; stroke-dasharray:6 5; }
      .busl { fill:#22d3ee; font-size:11px; font-weight:700; }
    </style>
  </defs>
  <rect x="0" y="0" width="980" height="420" fill="#0f1218"/>
  <text class="t" x="40" y="36">RPC DRAM throughput on the CertusPro-NX VVML board</text>
  <text class="s" x="40" y="56">MiB/s, sys_clk 100MHz, CLK 400MHz (800MT/s), first EM6GA16L of the board</text>

  <!-- legend -->
  <rect x="700" y="72" width="16" height="12" rx="3" fill="#5d6673"/>
  <text class="s" x="722" y="83">Write</text>
  <rect x="810" y="72" width="16" height="12" rx="3" fill="#2493c0"/>
  <text class="s" x="832" y="83">Read</text>

  <!-- y: 0..1600 MiB/s over y=330..100 (0.14375 px per MiB/s) -->
  <line class="grid" x1="90" y1="330" x2="940" y2="330"/>
  <line class="grid" x1="90" y1="272.5" x2="940" y2="272.5"/>
  <line class="grid" x1="90" y1="215" x2="940" y2="215"/>
  <line class="grid" x1="90" y1="157.5" x2="940" y2="157.5"/>
  <line class="grid" x1="90" y1="100" x2="940" y2="100"/>
  <text class="ax" x="80" y="334" text-anchor="end">0</text>
  <text class="ax" x="80" y="276" text-anchor="end">400</text>
  <text class="ax" x="80" y="219" text-anchor="end">800</text>
  <text class="ax" x="80" y="161" text-anchor="end">1200</text>
  <text class="ax" x="80" y="104" text-anchor="end">1600</text>

  <!-- DB bus capacity: 1526 MiB/s -->
  <line class="bus" x1="90" y1="110.6" x2="940" y2="110.6"/>
  <text class="busl" x="100" y="124">DB bus at 800MT/s: 1526 MiB/s</text>

  <!-- BIOS memspeed: 33.9 / 50.7 -->
  <rect x="176" y="325.1" width="70" height="4.9" rx="2" fill="#5d6673"/>
  <rect x="250" y="322.7" width="70" height="7.3" rx="2" fill="#2493c0"/>
  <text class="val" x="211" y="317" text-anchor="middle">33.9</text>
  <text class="val" x="285" y="315" text-anchor="middle">50.7</text>
  <text class="lbl" x="248" y="354" text-anchor="middle">BIOS memspeed</text>
  <text class="sub" x="248" y="372" text-anchor="middle">through the CPU</text>

  <!-- BIST without streaming: 356 / 356 -->
  <rect x="446" y="278.8" width="70" height="51.2" rx="4" fill="#5d6673"/>
  <rect x="520" y="278.8" width="70" height="51.2" rx="4" fill="#2493c0"/>
  <text class="val" x="481" y="271" text-anchor="middle">356</text>
  <text class="val" x="555" y="271" text-anchor="middle">356</text>
  <text class="lbl" x="518" y="354" text-anchor="middle">BIST</text>
  <text class="sub" x="518" y="372" text-anchor="middle">one Request Packet per WORD</text>

  <!-- BIST with streaming: 1315 / 1313 -->
  <rect x="716" y="141.0" width="70" height="189.0" rx="4" fill="#5d6673"/>
  <rect x="790" y="141.3" width="70" height="188.7" rx="4" fill="#2493c0"/>
  <text class="val" x="751" y="134" text-anchor="middle">1315</text>
  <text class="val" x="825" y="134" text-anchor="middle">1313</text>
  <text class="lbl" x="788" y="354" text-anchor="middle">BIST, Address Streaming</text>
  <text class="sub" x="788" y="372" text-anchor="middle">read and write streaming on</text>

  <text class="sub" x="40" y="404">BIST: sdram_bist 4096, sequential and random addresses, 97.6GiB tested without error with streaming on.</text>
</svg>
