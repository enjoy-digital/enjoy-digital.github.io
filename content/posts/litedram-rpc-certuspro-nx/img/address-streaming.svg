<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <defs>
    <style>
      .t    { fill:#2EAADC; font-size:16px; font-weight:700; }
      .s    { fill:#8e96a2; font-size:12px; }
      .h    { fill:#e6e8e3; font-size:13px; font-weight:700; }
      .lane { fill:#8e96a2; font-size:12px; font-weight:700; }
      .sub  { fill:#8e96a2; font-size:11px; }
      .in   { fill:#0f1218; font-size:11px; font-weight:700; }
      .inl  { fill:#e6e8e3; font-size:11px; font-weight:700; }
      .base { stroke:#2a313b; stroke-width:1.5; }
      .tick { stroke:#2a313b; stroke-width:1; stroke-dasharray:3 4; }
      .req  { fill:#2EAADC; }
      .ser  { fill:#1c2129; stroke:#2EAADC; stroke-width:1.5; }
      .stop { fill:#1c2129; stroke:#8e96a2; stroke-width:1.5; }
      .word { fill:#22d3ee; }
      .dim  { stroke:#8e96a2; stroke-width:1; }
    </style>
  </defs>
  <rect x="0" y="0" width="980" height="470" fill="#0f1218"/>
  <text class="t" x="40" y="36">RPC DRAM reads: one Request Packet per WORD, or Address Streaming</text>
  <text class="s" x="40" y="56">Schematic, not to scale. One sys_clk cycle is 4 tCK; a WORD is 16 beats of 16 bits (32 bytes) over 8 tCK.</text>

  <!-- Panel A -->
  <text class="h" x="40" y="96">Without streaming: a new Request Packet every 8 to 9 sys_clk cycles</text>
  <text class="lane" x="40" y="134">STB</text>
  <text class="lane" x="40" y="184">DB</text>
  <line class="base" x1="90" y1="146" x2="940" y2="146"/>
  <line class="base" x1="90" y1="196" x2="940" y2="196"/>

  <!-- command 1 -->
  <rect class="req"  x="110" y="166" width="46" height="30" rx="4"/>
  <text class="in"   x="133" y="185" text-anchor="middle">REQ</text>
  <rect class="ser"  x="160" y="116" width="100" height="30" rx="4"/>
  <text class="inl"  x="210" y="135" text-anchor="middle">serial</text>
  <rect class="word" x="290" y="166" width="100" height="30" rx="4"/>
  <text class="in"   x="340" y="185" text-anchor="middle">WORD 0</text>

  <!-- command 2 -->
  <rect class="req"  x="540" y="166" width="46" height="30" rx="4"/>
  <text class="in"   x="563" y="185" text-anchor="middle">REQ</text>
  <rect class="ser"  x="590" y="116" width="100" height="30" rx="4"/>
  <text class="inl"  x="640" y="135" text-anchor="middle">serial</text>
  <rect class="word" x="720" y="166" width="100" height="30" rx="4"/>
  <text class="in"   x="770" y="185" text-anchor="middle">WORD 1</text>

  <!-- period marker -->
  <line class="dim" x1="110" y1="214" x2="540" y2="214"/>
  <line class="dim" x1="110" y1="208" x2="110" y2="220"/>
  <line class="dim" x1="540" y1="208" x2="540" y2="220"/>
  <text class="sub" x="325" y="232" text-anchor="middle">latency + burst + tBESL: 32 bytes per 8 to 9 sys_clk cycles, 356 MiB/s at 100MHz</text>

  <!-- Panel B -->
  <text class="h" x="40" y="286">With Address Streaming: the next address on STB every 8 tCK</text>
  <text class="lane" x="40" y="324">STB</text>
  <text class="lane" x="40" y="374">DB</text>
  <line class="base" x1="90" y1="336" x2="940" y2="336"/>
  <line class="base" x1="90" y1="386" x2="940" y2="386"/>

  <rect class="req"  x="110" y="356" width="46" height="30" rx="4"/>
  <text class="in"   x="133" y="375" text-anchor="middle">REQ</text>

  <rect class="ser"  x="160" y="306" width="100" height="30" rx="4"/>
  <text class="inl"  x="210" y="325" text-anchor="middle">RD addr 1</text>
  <rect class="ser"  x="260" y="306" width="100" height="30" rx="4"/>
  <text class="inl"  x="310" y="325" text-anchor="middle">RD addr 2</text>
  <rect class="ser"  x="360" y="306" width="100" height="30" rx="4"/>
  <text class="inl"  x="410" y="325" text-anchor="middle">RD addr 3</text>
  <rect class="ser"  x="460" y="306" width="100" height="30" rx="4"/>
  <text class="inl"  x="510" y="325" text-anchor="middle">RD addr 4</text>
  <rect class="stop" x="560" y="306" width="100" height="30" rx="4"/>
  <text class="inl"  x="610" y="325" text-anchor="middle">Burst Stop</text>

  <rect class="word" x="290" y="356" width="98" height="30" rx="4"/>
  <text class="in"   x="339" y="375" text-anchor="middle">WORD 0</text>
  <rect class="word" x="390" y="356" width="98" height="30" rx="4"/>
  <text class="in"   x="439" y="375" text-anchor="middle">WORD 1</text>
  <rect class="word" x="490" y="356" width="98" height="30" rx="4"/>
  <text class="in"   x="539" y="375" text-anchor="middle">WORD 2</text>
  <rect class="word" x="590" y="356" width="98" height="30" rx="4"/>
  <text class="in"   x="639" y="375" text-anchor="middle">WORD 3</text>
  <rect class="word" x="690" y="356" width="98" height="30" rx="4"/>
  <text class="in"   x="739" y="375" text-anchor="middle">WORD 4</text>

  <line class="dim" x1="390" y1="404" x2="488" y2="404"/>
  <line class="dim" x1="390" y1="398" x2="390" y2="410"/>
  <line class="dim" x1="488" y1="398" x2="488" y2="410"/>
  <text class="sub" x="500" y="408">2 sys_clk cycles per WORD, no gap on DB: 1315 MiB/s at 100MHz</text>

  <text class="sub" x="40" y="448">REQ: Request Packet (parallel command on DB). Serial Packets travel on STB; any bank with an open row, any column.</text>
</svg>
