<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <defs>
    <style>
      .t     { fill:#2EAADC; font-size:16px; font-weight:700; }
      .h     { fill:#ffffff; font-size:15px; font-weight:700; }
      .lbl   { fill:#cfd2cc; font-size:13px; font-weight:700; }
      .sub   { fill:#8e96a2; font-size:11px; }
      .big   { fill:#161b22; stroke:#2EAADC; stroke-width:2.5; }
      .box   { fill:#1c2129; stroke:#2EAADC; stroke-width:1.8; }
      .key   { fill:#102a33; stroke:#22d3ee; stroke-width:2.5; }
      .w     { fill:none; stroke:#2EAADC; stroke-width:2; marker-end:url(#a); }
      .fat   { fill:none; stroke:#22d3ee; stroke-width:4; marker-end:url(#c); }
      .thin  { fill:none; stroke:#8e96a2; stroke-width:1.8; stroke-dasharray:6 4; marker-end:url(#g); marker-start:url(#gs); }
    </style>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2EAADC"/></marker>
    <marker id="c" markerWidth="7" markerHeight="7" refX="5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="#22d3ee"/></marker>
    <marker id="g" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#8e96a2"/></marker>
    <marker id="gs" markerWidth="9" markerHeight="9" refX="0" refY="3" orient="auto"><path d="M7,0 L0,3 L7,6 Z" fill="#8e96a2"/></marker>
  </defs>
  <rect x="0" y="0" width="980" height="470" fill="#0f1218"/>
  <text class="t" x="490" y="32" text-anchor="middle">ChromatiX SDR: from the ESP32 radio to the LCD and the PC</text>

  <!-- ESP32 -->
  <rect class="big" x="20" y="60" width="220" height="300" rx="12"/>
  <text class="h" x="130" y="86" text-anchor="middle">ESP32</text>
  <rect class="box" x="40" y="104" width="180" height="62" rx="9"/>
  <text class="lbl" x="130" y="128" text-anchor="middle">2.4 GHz radio</text>
  <text class="sub" x="130" y="146" text-anchor="middle">LNA · mixer · ADC</text>
  <rect class="key" x="40" y="196" width="180" height="78" rx="9"/>
  <text class="lbl" x="130" y="220" text-anchor="middle" fill="#67e8f9">ESP-SDR</text>
  <text class="sub" x="130" y="238" text-anchor="middle">modem bypass, I/Q bursts</text>
  <text class="sub" x="130" y="254" text-anchor="middle">+ QSPI transport, tuning</text>
  <text class="sub" x="130" y="268" text-anchor="middle">2150-2880 MHz</text>
  <line class="w" x1="130" y1="166" x2="130" y2="192"/>
  <text class="sub" x="130" y="300" text-anchor="middle">16/40/80 MS/s</text>
  <text class="sub" x="130" y="316" text-anchor="middle">up to 16380 samples</text>

  <!-- FPGA -->
  <rect class="big" x="330" y="60" width="430" height="300" rx="12"/>
  <text class="h" x="545" y="86" text-anchor="middle">GW5A-25 · --with-app</text>
  <rect class="box" x="350" y="104" width="160" height="62" rx="9"/>
  <text class="lbl" x="430" y="128" text-anchor="middle">QSPI slave</text>
  <text class="sub" x="430" y="146" text-anchor="middle">1 KB → PSRAM burst</text>
  <rect class="key" x="580" y="104" width="160" height="62" rx="9"/>
  <text class="lbl" x="660" y="128" text-anchor="middle" fill="#67e8f9">PSRAM</text>
  <text class="sub" x="660" y="146" text-anchor="middle">7.5 MB main RAM</text>
  <rect class="box" x="350" y="196" width="160" height="78" rx="9"/>
  <text class="lbl" x="430" y="220" text-anchor="middle">VexRiscv 67 MHz</text>
  <text class="sub" x="430" y="238" text-anchor="middle">512-pt int16 FFT</text>
  <text class="sub" x="430" y="254" text-anchor="middle">x8 avg · UI · relay</text>
  <rect class="box" x="580" y="196" width="160" height="78" rx="9"/>
  <text class="lbl" x="660" y="220" text-anchor="middle">Frame buffer</text>
  <text class="sub" x="660" y="238" text-anchor="middle">PSRAM, triple buffer</text>
  <text class="sub" x="660" y="254" text-anchor="middle">→ video pipeline</text>
  <rect class="box" x="350" y="296" width="390" height="46" rx="9"/>
  <text class="lbl" x="545" y="317" text-anchor="middle">cdc_link: USB CDC · app UART + DMA</text>
  <text class="sub" x="545" y="333" text-anchor="middle">1200 baud touch → back to the debug bridge</text>

  <line class="fat" x1="510" y1="135" x2="572" y2="135"/>
  <line class="w" x1="600" y1="166" x2="512" y2="210"/>
  <line class="w" x1="510" y1="235" x2="576" y2="235"/>
  <line class="w" x1="430" y1="274" x2="430" y2="292"/>
  <path class="w" d="M660,166 V180 H750 V300 H744"/>

  <!-- ESP32 to FPGA -->
  <line class="fat" x1="220" y1="226" x2="252" y2="226"/>
  <path class="fat" d="M252,226 H290 V135 H342"/>
  <text class="sub" x="285" y="104" text-anchor="middle">QSPI</text>
  <text class="sub" x="285" y="118" text-anchor="middle">40 MHz</text>
  <path class="thin" d="M224,256 H346"/>
  <text class="sub" x="285" y="278" text-anchor="middle">UART</text>
  <text class="sub" x="285" y="292" text-anchor="middle">commands</text>
  <text class="sub" x="285" y="306" text-anchor="middle">headers</text>

  <!-- outputs -->
  <rect class="box" x="800" y="196" width="160" height="78" rx="9"/>
  <text class="lbl" x="880" y="220" text-anchor="middle">LCD + UVC</text>
  <text class="sub" x="880" y="238" text-anchor="middle">spectrum · waterfall</text>
  <text class="sub" x="880" y="254" text-anchor="middle">band scan · ~26/s</text>
  <line class="w" x1="740" y1="235" x2="796" y2="235"/>

  <rect class="box" x="800" y="380" width="160" height="70" rx="9"/>
  <text class="lbl" x="880" y="404" text-anchor="middle">PC</text>
  <text class="sub" x="880" y="422" text-anchor="middle">SoapyChromatic</text>
  <text class="sub" x="880" y="438" text-anchor="middle">gqrx · GNU Radio</text>
  <path class="fat" d="M545,342 V415 H792"/>
  <text class="sub" x="668" y="405" text-anchor="middle">USB 2.0 · 2.4 MB/s relayed captures</text>
</svg>
